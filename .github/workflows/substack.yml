name: HookForge AI Autonomous Promoter (Every 4 Hours)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  marketing-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Generate and Publish
        env:
          SUBSTACK_COOKIES: ${{ secrets.SUBSTACK_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
        run: node publish-bot.js

      # 📸 رفع لقطة الشاشة تلقائياً إذا فشل الروبوت
      - name: Upload Error Screenshot if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: substack-error-screen
          path: error-screenshot.png
